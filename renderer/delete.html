<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Delete File/Folder</title>
<style>
  body { font-family: Arial; padding: 20px; }
  input { width: 100%; padding: 6px; margin: 8px 0; }
  button { padding: 8px 12px; }
  #result { margin-top: 12px; color: #333; font-size: 0.9rem; }
</style>
</head>
<body>
<h3>Delete File or Folder</h3>
<input type="text" id="path" placeholder="Enter full path (C:\\Users\\...)" />
<button id="deleteBtn">Delete</button>
<div id="result"></div>

<script>
const pathInput = document.getElementById("path");
const resultDiv = document.getElementById("result");

document.getElementById("deleteBtn").onclick = () => {
  const val = pathInput.value.trim();
  if (!val) { resultDiv.textContent = "Please enter a path."; return; }
  window.electronAPI.performDelete(val);
};

window.electronAPI.onLog((data) => {
  resultDiv.textContent = data;
});
</script>
</body>
</html>
